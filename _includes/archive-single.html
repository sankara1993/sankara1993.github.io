<article class="row" data-topics="{{ post.categories | join: ' ' | downcase }} {{ post.tags | join: ' ' | downcase }}">
  <time class="row__date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %-d, %Y" }}</time>
  <div class="row__main">
    <h3 class="row__title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <p class="row__excerpt">{{ post.excerpt | strip_html | strip }}</p>
  </div>
  <p class="row__meta">
    <span>{{ post.categories | first }}</span>
    <span>{{ post.content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
  </p>
</article>
