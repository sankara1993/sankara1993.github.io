# ===========================
# Site settings
# ===========================
locale: "en-US"
title: "Aravind Sankar"
description: "Personal site and blog: MBA coursework at Ohio State's Fisher College of Business, projects, and my story."
intro: "This is where I document what I'm building: ongoing notes from my MBA classes, project work, and the story behind it all."
url: "https://aravindsankar.com"

baseurl: ""

# ===========================
# Build settings (no theme: the design lives in _layouts, _includes, assets)
# ===========================
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

include: ["_pages"]
exclude: ["README.md"]

# ===========================
# Collections (Portfolio)
# ===========================
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single

# ===========================
# Author
# ===========================
author:
  name: "Aravind Sankar"
  avatar: "/assets/images/avatar.jpg"
  bio: "Analytics Manager at Thermo Fisher Scientific. Working Professional MBA at Ohio State's Fisher College of Business. Columbus, OH."
  email: "asankara1993@gmail.com"
  links:
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/sankar-aravind"
    - label: "GitHub"
      url: "https://github.com/sankara1993"
